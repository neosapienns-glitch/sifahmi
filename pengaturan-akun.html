<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1b5e20">
    <title>SIFAHMI - Pengaturan Akun</title>
    <link rel="stylesheet" href="./app-shell.css">
    <style>
        :root { --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --green-dark:#1b5e20; --page:#f1f5f9; }
        *, *::before, *::after { box-sizing:border-box; }
        html, body { background:var(--page); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
        .role-topbar { background:rgba(255,255,255,.8); border-bottom:1px solid var(--line); padding:14px 22px; display:flex; align-items:center; justify-content:space-between; }
        .role-topbar h1 { font-size:16px; }
        .role-topbar p { margin-top:3px; color:var(--muted); font-size:11px; }
        main.container { width:min(100%,760px); margin:0 auto; padding:24px; }
        .panel { padding:22px; border:1px solid rgba(255,255,255,.85); border-radius:19px; background:rgba(255,255,255,.88); box-shadow:inset 0 1px #fff,0 12px 28px rgba(15,23,42,.055); }
        .panel h2 { font-size:17px; }
        .panel-intro { margin-top:5px; color:var(--muted); font-size:12px; line-height:1.55; }
        .settings-form { display:grid; grid-template-columns:1fr 1fr; gap:13px; margin-top:18px; }
        .settings-form label { display:block; margin-bottom:6px; color:var(--muted); font-size:11px; font-weight:800; }
        .settings-form input { width:100%; min-height:43px; padding:9px 11px; border:1px solid var(--line); border-radius:10px; font:inherit; }
        .settings-form button { grid-column:1/-1; min-height:42px; border:0; border-radius:11px; background:var(--green-dark); color:#fff; font:inherit; font-size:12px; font-weight:800; cursor:pointer; }
        .settings-form button:disabled { opacity:.65; cursor:wait; }
        .role-message { display:none; margin-top:12px; padding:11px 13px; border-radius:10px; background:#e9f8ef; color:#1b5e20; font-size:12px; line-height:1.5; }
        .role-message.error { background:#fdecea; color:#a93226; }
        .role-message.visible { display:block; }
        .empty { color:var(--muted); font-size:12px; }
        @media(max-width:600px){ main.container{padding:17px 13px}.settings-form{grid-template-columns:1fr}.settings-form button{grid-column:auto}.role-topbar{padding:12px 14px} }
    </style>
    <script src="./app-shell.js" defer></script>
    <script src="./role-dashboard.js" defer></script>
    <script src="./app-updater.js" defer></script>
</head>
<body data-dashboard-page="credentials">
    <header class="top-bar role-topbar">
        <div><h1>Pengaturan Akun</h1><p>Perbarui username dan password akun Anda</p></div>
        <span id="account-name" style="font-size:12px;font-weight:800;color:#1b5e20;">Memuat akun...</span>
    </header>
    <main class="container">
        <section class="panel">
            <h2>Ganti Username dan Password</h2>
            <p class="panel-intro">Username harus terdiri dari minimal 3 karakter. Password baru minimal 6 karakter dan digunakan saat login berikutnya.</p>
            <form class="settings-form" id="credentials-form">
                <div><label for="new-username">Username baru</label><input id="new-username" required minlength="3" maxlength="40" autocomplete="username"></div>
                <div><label for="new-password">Password baru</label><input id="new-password" type="password" required minlength="6" autocomplete="new-password"></div>
                <div><label for="confirm-password">Ulangi password baru</label><input id="confirm-password" type="password" required minlength="6" autocomplete="new-password"></div>
                <button type="submit">Perbarui Kredensial</button>
            </form>
            <div class="role-message" id="credentials-message" role="status" aria-live="polite"></div>
        </section>
    </main>
</body>
</html>
