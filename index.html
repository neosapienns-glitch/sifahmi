<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#27ae60">
    <title>Login E-Santri</title>
    <style>
        :root {
            color-scheme: light;
            --green: #27ae60;
            --green-dark: #219150;
            --ink: #2c3e50;
            --muted: #7f8c8d;
            --line: #dfe5e8;
            --page: #f4f7f9;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 24px 16px;
            display: grid;
            place-items: center;
            background: var(--page);
            color: var(--ink);
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        .login-card {
            width: min(100%, 400px);
            padding: 30px;
            border-radius: 20px;
            background: #fff;
            box-shadow: 0 10px 28px rgba(0, 0, 0, .07);
        }

        .brand { margin-bottom: 22px; text-align: center; }
        .brand img { width: 82px; height: 82px; object-fit: contain; }
        .brand-name {
            margin: 10px 0 0;
            color: var(--green);
            font-size: 15px;
            font-weight: 700;
            line-height: 1.35;
            text-transform: uppercase;
        }

        h1 { margin: 0; text-align: center; font-size: 20px; }
        .subtitle { margin: 7px 0 22px; color: var(--muted); text-align: center; font-size: 13px; line-height: 1.5; }

        .field { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 600; }
        input {
            width: 100%;
            min-height: 46px;
            padding: 11px 12px;
            border: 1px solid var(--line);
            border-radius: 9px;
            outline: none;
            background: #fff;
            color: var(--ink);
            font: inherit;
            font-size: 14px;
        }

        input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(39, 174, 96, .12); }

        .submit {
            width: 100%;
            min-height: 48px;
            margin-top: 5px;
            border: 0;
            border-radius: 9px;
            background: var(--green);
            color: #fff;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            transition: background .2s, opacity .2s;
        }

        .submit:hover { background: var(--green-dark); }
        .submit:disabled { cursor: wait; opacity: .7; }

        .message {
            margin: 0 0 16px;
            padding: 11px 12px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.5;
        }

        .message[hidden], [hidden] { display: none !important; }
        .message.error { background: #fdecea; color: #a93226; }
        .message.success { background: #e9f8ef; color: #1e8449; }

        footer { margin-top: 24px; color: #95a5a6; text-align: center; font-size: 11px; line-height: 1.6; }
        footer strong { display: block; margin-bottom: 4px; color: var(--muted); }

        @media (max-width: 420px) {
            .login-card { padding: 24px 20px; }
            .brand img { width: 72px; height: 72px; }
        }
    </style>
</head>
<body>
    <main class="login-card">
        <header class="brand">
            <img src="./logo.png" alt="Logo Yayasan Nuuru Hidaayatil Qur'aan">
            <p class="brand-name">YAYASAN NUURU HIDAAYATIL<br>QUR'AAN</p>
        </header>

        <h1>SIFAHMI</h1>
        <p class="subtitle">SYSTEM INFORMASI HAFALAN &amp; MUTABAAH ISLAMI</p>

        <div class="message" id="form-message" role="status" aria-live="polite" hidden></div>

        <form id="auth-form" novalidate>
            <div class="field">
                <label for="email">Username / Email</label>
                <input id="email" name="email" type="text" autocomplete="username" placeholder="Username (wali: NIS) atau email" required>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="current-password" minlength="6" placeholder="Masukkan password" required>
            </div>

            <button class="submit" id="submit-button" type="submit">MASUK SEKARANG</button>
        </form>

        <footer>
            <strong>© 2026 Manajemen Santri YAYASAN NUURU HIDAAYATIL QUR'AAN</strong>
            Jln jend. AH Nasution Gg Jamaras 3 RT 003 / 001<br>
            Kel. Jatihandap Kec. Mandalajati Bandung 40195
        </footer>
    </main>

    <script>
        "use strict";

        const SUPABASE_URL = "https://dfakfkngujlhbcrhxmmk.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRmYWtma25ndWpsaGJjcmh4bW1rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1Njg0ODAsImV4cCI6MjEwOTE0NDQ4MH0.BPCdp7Y4JLjLHdV4Rd1mRTkWwDctyD3qC-_aUFX_CS4";
        const SESSION_KEY = "ynhq-supabase-session";

        const form = document.getElementById("auth-form");
        const message = document.getElementById("form-message");
        const submitButton = document.getElementById("submit-button");
        const passwordInput = document.getElementById("password");

        // Cek jika pengguna sudah memiliki sesi login aktif, langsung arahkan ke dashboard
        (async function checkExistingSession() {
            const sessionRaw = localStorage.getItem(SESSION_KEY);
            if (!sessionRaw) return;
            let session;
            try {
                session = JSON.parse(sessionRaw);
            } catch (e) {
                localStorage.removeItem(SESSION_KEY);
                return;
            }
            if (session.access_token) {
                session.supabase_url = SUPABASE_URL;
                session.supabase_anon_key = SUPABASE_ANON_KEY;
                localStorage.setItem(SESSION_KEY, JSON.stringify(session));
                let metadata = session.user && session.user.user_metadata;
                if (session.user?.id) {
                    try {
                        const response = await fetch(`${SUPABASE_URL}/rest/v1/profiles?select=role&id=eq.${encodeURIComponent(session.user.id)}`, {
                            headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${session.access_token}` }
                        });
                        if (response.ok) metadata = { ...metadata, ...(await response.json())[0] };
                    } catch (error) {
                        console.error("Gagal memuat role dari profil:", error);
                    }
                }
                window.location.href = landingPage(metadata);
            }
        })();

        function landingPage(metadata) {
            if (metadata && metadata.role === "Asatidz") return "dashboard-asatidz.html";
            if (metadata && metadata.role === "Wali Murid") return "dashboard-wali.html";
            return "dashboard.html";
        }

        function setMessage(text, kind) {
            message.textContent = text;
            message.className = "message " + kind;
            message.hidden = false;
        }

        function responseMessage(payload, fallback) {
            return payload && (payload.msg || payload.message || payload.error_description || payload.error) || fallback;
        }

        async function authRequest(path, payload) {
            const response = await fetch(SUPABASE_URL + "/auth/v1/" + path, {
                method: "POST",
                headers: {
                    "apikey": SUPABASE_ANON_KEY,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(payload)
            });

            let result;
            try {
                result = await response.json();
            } catch (error) {
                throw new Error("Respons server tidak dapat dibaca. Coba lagi beberapa saat.");
            }

            if (!response.ok) {
                const error = new Error(responseMessage(result, "Permintaan autentikasi gagal."));
                error.code = result && (result.error_code || result.code);
                error.errorId = result && result.error_id;
                throw error;
            }
            return result;
        }

        form.addEventListener("submit", async function (event) {
            event.preventDefault();
            message.hidden = true;

            const username = document.getElementById("email").value.trim();
            const email = username.includes("@") ? username : `${username.toLowerCase()}@login.sifahmi.id`;
            const password = passwordInput.value;

            if (!form.reportValidity()) return;

            submitButton.disabled = true;
            submitButton.textContent = "MEMERIKSA...";

            try {
                const result = await authRequest("token?grant_type=password", {
                    email: email,
                    password: password
                });
                
                result.expires_at = Math.floor(Date.now() / 1000) + (result.expires_in || 3600);
                result.supabase_url = SUPABASE_URL;
                result.supabase_anon_key = SUPABASE_ANON_KEY;
                localStorage.setItem(SESSION_KEY, JSON.stringify(result));
                
                setMessage("Login berhasil! Mengalihkan ke Dashboard...", "success");

                // Berikan jeda 1 detik agar pengguna sempat melihat notifikasi sukses sebelum pindah halaman
                setTimeout(function() {
                    window.location.href = landingPage(result.user && result.user.user_metadata);
                }, 1000);

            } catch (error) {
                console.error("Supabase Auth error:", error);
                setMessage(error.message || "Tidak dapat menghubungi Supabase. Periksa koneksi internet dan konfigurasi project.", "error");
                submitButton.disabled = false;
                submitButton.textContent = "MASUK SEKARANG";
            }
        });
    </script>
</body>
</html>
