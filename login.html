<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#168033">
    <title>Login SIFAHMI - Yayasan Nuuru Hidaayatil Qur'aan</title>
    <style>
        :root {
            color-scheme: light;
            --green-primary: #168033;
            --green-bright: #27b34d;
            --green-deep: #0f5c24;
            --green-soft: #e8f7ed;
            --ink: #1e293b;
            --muted: #64748b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 14px;
            font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            color: var(--ink);
            
            /* =========================================================
               LATAR BELAKANG KELAS MA'HAD YG LEBIH HIDUP DAN ALAMI
               ========================================================= */
            background: 
                linear-gradient(135deg, rgba(15, 23, 42, 0.5) 0%, rgba(22, 128, 51, 0.45) 100%),
                url('image_13.png') no-repeat center center;
            background-size: cover;
            background-attachment: fixed;
            
            overflow-x: hidden;
            position: relative;
        }

        /* Blur halus di balik kartu agar teks dan form login selalu mudah dibaca */
        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(2px);
            z-index: 0;
            pointer-events: none;
        }

        /* Stage Konten Login */
        .login-stage {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            width: min(100%, 460px);
            padding: 10px 0;
        }

        /* Kartu Login 3D Putih Berkelas (Soft Glass Effect) */
        .login-card {
            width: 100%;
            padding: 32px 30px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.8);
            
            /* Bayangan Timbul Ganda (Double Depth Shadow) */
            box-shadow:
                inset 0 1.5px 0 0 rgba(255, 255, 255, 1),
                0 4px 6px -1px rgba(0, 0, 0, 0.05),
                0 20px 40px -4px rgba(15, 23, 42, 0.35);
            
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* Brand & Logo */
        .brand {
            text-align: center;
            margin-bottom: 4px;
        }

        .brand img {
            width: 76px;
            height: 76px;
            object-fit: contain;
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.08));
        }

        .brand-name {
            margin-top: 8px;
            color: var(--green-primary);
            font-size: 13.5px;
            font-weight: 800;
            line-height: 1.3;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        h1 {
            text-align: center;
            font-size: 26px;
            font-weight: 900;
            color: var(--green-deep);
            letter-spacing: 0.5px;
            line-height: 1.1;
        }

        .subtitle {
            text-align: center;
            font-size: 10px;
            font-weight: 800;
            color: var(--muted);
            letter-spacing: 0.4px;
            text-transform: uppercase;
        }

        /* Alert Pesan Status */
        .message {
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 12.5px;
            font-weight: 700;
            line-height: 1.45;
            text-align: center;
            margin-top: 4px;
        }
        .message[hidden], [hidden] { display: none !important; }
        .message.error { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
        .message.success { background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }

        form {
            margin-top: 6px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Input Kapsul (Pill) dengan Ikon */
        .pill-field {
            position: relative;
            display: flex;
            align-items: center;
        }

        .pill-icon-left {
            position: absolute;
            left: 16px;
            width: 19px;
            height: 19px;
            color: var(--green-primary);
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pill-field input {
            width: 100%;
            height: 46px;
            padding: 0 44px 0 44px;
            border: 1.5px solid #cbd5e1;
            border-radius: 999px;
            background: #f8fafc;
            color: var(--ink);
            font: inherit;
            font-size: 13.5px;
            font-weight: 600;
            outline: none;
            box-shadow: inset 0 2px 4px rgba(15, 23, 42, 0.04);
            transition: all 0.2s ease;
        }

        .pill-field input::placeholder {
            color: #94a3b8;
            font-weight: 500;
        }

        .pill-field input:focus {
            background: #ffffff;
            border-color: var(--green-bright);
            box-shadow:
                inset 0 1px 2px rgba(15, 23, 42, 0.02),
                0 0 0 4px rgba(39, 179, 77, 0.16);
        }

        .btn-toggle-pass {
            position: absolute;
            right: 14px;
            background: transparent;
            border: 0;
            color: var(--green-primary);
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.85;
            transition: opacity 0.2s;
        }
        .btn-toggle-pass:hover { opacity: 1; }

        /* Forgot Password Link */
        .forgot-row {
            display: flex;
            justify-content: flex-end;
            margin: -4px 6px 4px;
        }
        .forgot-link {
            background: none;
            border: none;
            padding: 0;
            font: inherit;
            font-size: 11.5px;
            font-weight: 700;
            color: var(--green-primary);
            cursor: pointer;
            text-decoration: none;
        }
        .forgot-link:hover { text-decoration: underline; color: var(--green-deep); }

        /* Tombol Login 3D Glossy */
        .submit-3d {
            position: relative;
            width: 100%;
            height: 48px;
            border: 0;
            border-radius: 999px;
            background: linear-gradient(180deg, #2cc455 0%, #168033 60%, #0e5c23 100%);
            color: #ffffff;
            font: inherit;
            font-size: 15.5px;
            font-weight: 800;
            letter-spacing: 0.4px;
            cursor: pointer;
            box-shadow:
                0 4px 0 #0a471b,
                0 10px 18px rgba(22, 128, 51, 0.3),
                inset 0 2px 2px rgba(255, 255, 255, 0.4);
            transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.2s ease;
            overflow: hidden;
        }

        .submit-3d::before {
            content: "";
            position: absolute;
            top: 2px;
            left: 14px;
            right: 14px;
            height: 42%;
            border-radius: 999px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.45) 0%, rgba(255, 255, 255, 0.05) 100%);
            pointer-events: none;
        }

        .submit-3d:hover {
            filter: brightness(1.05);
        }

        .submit-3d:active {
            transform: translateY(2px);
            box-shadow:
                0 2px 0 #0a471b,
                0 6px 12px rgba(22, 128, 51, 0.25),
                inset 0 1px 2px rgba(255, 255, 255, 0.3);
        }

        .submit-3d:disabled {
            cursor: wait;
            opacity: 0.75;
        }

        /* Footer Info & Alamat Yayasan */
        .card-footer {
            margin-top: 8px;
        }

        .copyright-divider {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            color: var(--green-primary);
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.2px;
        }
        .copyright-divider::before,
        .copyright-divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, #86efac, transparent);
        }

.address-pill {
    display: flex;
    align-items: center;
    justify-content: center; /* Memposisikan isi ke tengah kotak */
    gap: 9px;
    padding: 8px 12px;
    border-radius: 14px;
    background: #f8fafc;
    border: 1px solid #cbd5e1;
    box-shadow: inset 0 1px 2px rgba(255,255,255,1);
}
        .address-pill svg {
            width: 18px;
            height: 18px;
            color: var(--green-primary);
            flex-shrink: 0;
        }

.address-pill p {
    font-size: 9.5px;
    font-weight: 700;
    color: var(--green-deep);
    line-height: 1.35;
    text-align: center; /* Membuat baris teks alamat rata tengah */
}
        @media (max-width: 420px) {
            .login-card { padding: 24px 20px 20px; border-radius: 24px; }
            h1 { font-size: 23px; }
            .address-pill { border-radius: 12px; }
        }
    </style>
</head>
<body>

    <div class="login-stage">
        <!-- Kartu Login 3D Modern -->
        <main class="login-card">
            <header class="brand">
                <img src="./logo.png" alt="Logo Yayasan Nuuru Hidaayatil Qur'aan">
                <p class="brand-name">YAYASAN NUURU HIDAAYATIL<br>QURAAN</p>
                <h1>SIFAHMI</h1>
                <p class="subtitle">SYSTEM INFORMASI HAFALAN &amp; MUTABAAH ISLAMI</p>
            </header>

            <div class="message" id="form-message" role="status" aria-live="polite" hidden></div>

            <form id="auth-form" novalidate>
                <!-- Input Email -->
                <div class="pill-field">
                    <span class="pill-icon-left">
                        <svg viewBox="0 0 24 24" fill="currentColor" width="19" height="19">
                            <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
                        </svg>
                    </span>
                    <input id="email" name="email" type="email" autocomplete="email" placeholder="Username / Email" required>
                </div>

                <!-- Input Password -->
                <div class="pill-field">
                    <span class="pill-icon-left">
                        <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
                            <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                        </svg>
                    </span>
                    <input id="password" name="password" type="password" autocomplete="current-password" minlength="6" placeholder="Password" required>
                    <button type="button" class="btn-toggle-pass" id="toggle-password" aria-label="Tampilkan atau sembunyikan password" title="Lihat Password">
                        <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="19" height="19">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                            <line x1="1" y1="1" x2="23" y2="23"/>
                        </svg>
                    </button>
                </div>

                <div class="forgot-row">
                    <button type="button" class="forgot-link" id="btn-forgot-password">Forgot Password?</button>
                </div>

                <button class="submit-3d" id="submit-button" type="submit">Login</button>
            </form>

            <footer class="card-footer">
                <div class="copyright-divider">© Copyright Manajemen Santri</div>
                <div class="address-pill">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
                    </svg>
                    <p>
                        Jl. Jend. AH Nasution Gg. Jamaras 3 RT 003 / 001<br>
                        Kel. Jatihandap Kec. Mandalajati Bandung 40195
                    </p>
                </div>
            </footer>
        </main>
    </div>

    <script>
        "use strict";

        const SUPABASE_URL = "https://dfakfkngujlhbcrhxmmk.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRmYWtma25ndWpsaGJjcmh4bW1rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1Njg0ODAsImV4cCI6MjEwOTE0NDQ4MH0.BPCdp7Y4JLjLHdV4Rd1mRTkWwDctyD3qC-_aUFX_CS4";
        const SESSION_KEY = "ynhq-supabase-session";

        const form = document.getElementById("auth-form");
        const message = document.getElementById("form-message");
        const submitButton = document.getElementById("submit-button");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const togglePasswordBtn = document.getElementById("toggle-password");
        const eyeIcon = document.getElementById("eye-icon");
        const forgotBtn = document.getElementById("btn-forgot-password");

        // Cek sesi login aktif
        (function checkExistingSession() {
            const sessionRaw = localStorage.getItem(SESSION_KEY);
            if (sessionRaw) {
                try {
                    const session = JSON.parse(sessionRaw);
                    if (session.access_token) {
                        window.location.href = "dashboard.html";
                    }
                } catch (e) {
                    localStorage.removeItem(SESSION_KEY);
                }
            }
        })();

        // Fitur Lihat/Sembunyikan Password
        togglePasswordBtn.addEventListener("click", function () {
            const isHidden = passwordInput.type === "password";
            passwordInput.type = isHidden ? "text" : "password";
            eyeIcon.innerHTML = isHidden
                ? `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`
                : `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>`;
        });

        function setMessage(text, kind) {
            message.textContent = text;
            message.className = "message " + kind;
            message.hidden = false;
        }

        function responseMessage(payload, fallback) {
            return payload && (payload.msg || payload.message || payload.error_description || payload.error) || fallback;
        }

        async function authRequest(path, payload) {
            const response = await fetch(SUPABASE_URL + "/auth/v1/" + path, {
                method: "POST",
                headers: {
                    "apikey": SUPABASE_ANON_KEY,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(payload)
            });

            let result = {};
            try {
                result = await response.json();
            } catch (error) {
                if (!response.ok) {
                    throw new Error("Respons server tidak dapat dibaca. Coba lagi beberapa saat.");
                }
            }

            if (!response.ok) {
                const error = new Error(responseMessage(result, "Permintaan autentikasi gagal."));
                error.code = result && (result.error_code || result.code);
                throw error;
            }
            return result;
        }

        // Fitur Reset Password via Email Supabase
        forgotBtn.addEventListener("click", async function () {
            const email = emailInput.value.trim();
            if (!email) {
                setMessage("Masukkan alamat email akun terlebih dahulu pada kolom di atas, lalu klik Forgot Password.", "error");
                emailInput.focus();
                return;
            }

            forgotBtn.disabled = true;
            try {
                await authRequest("recover", { email: email });
                setMessage("Tautan reset password telah dikirim ke " + email + ". Silakan periksa kotak masuk / spam.", "success");
            } catch (err) {
                setMessage("Gagal mengirim reset password: " + err.message, "error");
            } finally {
                forgotBtn.disabled = false;
            }
        });

        // Submit Login Supabase
        form.addEventListener("submit", async function (event) {
            event.preventDefault();
            message.hidden = true;

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!form.reportValidity()) return;

            submitButton.disabled = true;
            submitButton.textContent = "Memeriksa...";

            try {
                const result = await authRequest("token?grant_type=password", {
                    email: email,
                    password: password
                });

                result.expires_at = Math.floor(Date.now() / 1000) + (result.expires_in || 3600);
                localStorage.setItem(SESSION_KEY, JSON.stringify(result));

                setMessage("Login berhasil! Mengalihkan ke Dashboard...", "success");

                setTimeout(function () {
                    window.location.href = "dashboard.html";
                }, 1000);

            } catch (error) {
                console.error("Supabase Auth error:", error);
                setMessage(error.message || "Email atau password tidak sesuai. Periksa kembali data masuk Anda.", "error");
                submitButton.disabled = false;
                submitButton.textContent = "Login";
            }
        });
    </script>
</body>
</html>
