<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1b5e20">
    <title>SIFAHMI - Dashboard Wali Santri</title>
    <link rel="stylesheet" href="./app-shell.css">
    <style>
        :root { --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --green-dark:#1b5e20; --green:#27ae60; --page:#f1f5f9; }
        *, *::before, *::after { box-sizing:border-box; }
        html, body { background:var(--page); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
        .role-topbar { background:rgba(255,255,255,.8); border-bottom:1px solid var(--line); padding:14px 22px; display:flex; align-items:center; justify-content:space-between; }
        .role-topbar h1 { font-size:16px; }
        .role-topbar p { margin-top:3px; color:var(--muted); font-size:11px; }
        main.container { width:min(100%,1120px); margin:0 auto; padding:24px; display:flex; flex-direction:column; gap:17px; }
        .panel { border:1px solid rgba(255,255,255,.85); border-radius:19px; background:rgba(255,255,255,.88); box-shadow:inset 0 1px #fff,0 12px 28px rgba(15,23,42,.055); }
        .panel { padding:20px; }
        .panel h3 { font-size:15px; }
        .panel-intro { margin-top:4px; color:var(--muted); font-size:11px; line-height:1.5; }
        .history-tools { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:15px; }
        .history-tools select { min-height:38px; padding:7px 11px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); font:inherit; font-size:12px; }
        .history-tools button { min-height:36px; padding:7px 11px; border:1px solid var(--line); border-radius:9px; background:#fff; color:var(--green-dark); font:inherit; font-size:11px; font-weight:750; cursor:pointer; }
        .history-tools button:disabled { opacity:.45; cursor:not-allowed; }
        .history-list { display:flex; flex-direction:column; gap:9px; margin-top:13px; }
        .history-item { padding:13px; border:1px solid #edf1f5; border-radius:13px; background:#f8fafc; }
        .history-item h4 { font-size:12px; }
        .history-item p { margin-top:4px; color:#475569; font-size:11px; line-height:1.55; white-space:pre-wrap; }
        .history-item time { display:block; margin-bottom:6px; color:#64748b; font-size:10px; font-weight:750; }
        .history-item .history-teacher { margin:0 0 6px; }
        .history-details { margin:0; padding-left:19px; color:#475569; font-size:11px; line-height:1.65; }
        .history-detail-empty { color:var(--muted); font-size:11px; }
        .empty { color:var(--muted); font-size:12px; line-height:1.6; }
        @media(max-width:650px){main.container{padding:17px 13px}.role-topbar{padding:12px 14px}}
    </style>
    <script src="./app-shell.js" defer></script>
    <script src="./role-dashboard.js" defer></script>
    <script src="./app-notifications.js" defer></script>
</head>
<body data-dashboard-role="Wali Murid">
    <header class="top-bar role-topbar">
        <div><h1>Dashboard Wali Santri</h1><p>Notifikasi dan riwayat santri Anda</p></div>
    </header>
    <main class="container">
        <div id="app-notifications"></div>

        <section class="panel">
            <h3>Riwayat Santri</h3>
            <p class="panel-intro">Pilih jenis laporan untuk melihat riwayat, maksimal enam catatan per halaman.</p>
            <div class="history-tools">
                <span style="font-size:11px;font-weight:750;color:#475569;">Riwayat terbaru</span>
                <select id="guardian-history-kind" aria-label="Pilih jenis riwayat">
                    <option value="mutabaah">Mutaba'ah</option>
                    <option value="raport">Rapor</option>
                </select>
            </div>
            <div class="history-list" id="guardian-history"><p class="empty">Memuat riwayat santri...</p></div>
            <div class="history-tools" aria-label="Navigasi halaman riwayat">
                <button type="button" id="guardian-history-prev" disabled>Lebih baru</button>
                <span id="guardian-history-page" class="empty" aria-live="polite">Halaman 1</span>
                <button type="button" id="guardian-history-next" disabled>Lebih lama</button>
            </div>
        </section>
    </main>
</body>
</html>
